<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pago | CreaTE</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<section class="planes">

<div class="intro-cards">
<img src="MI LOGO transparente.png" alt="CreaTE" class="logo-hero">
<p class="mini-title">
YA CASI ESTÁS DENTRO
</p>

<h2>
Elige cómo quieres pagar
</h2>

<p>
Selecciona el programa que quieres comenzar y el método de pago que prefieras.
</p>

</div>

<div class="cards">

<div class="card">

<h3>🕊 AcércaTE</h3>

<p class="precio">77 €/mes</p>

<br>

<label class="aceptacion">
<input type="checkbox" id="acepta-acercate">
<span>
He leído y acepto las
<a href="condiciones-servicio.html" target="_blank">Condiciones del Servicio</a>
y la
<a href="política-privacidad.html" target="_blank">Política de Privacidad</a>.
</span>
</label>

<br>

<a
href="https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-5SG36388CF647784GNJUNN7Q"
class="boton blanco boton-pago disabled"
id="pago-acercate"
>
Pagar con PayPal o tarjeta
</a>

</div>

<div class="card premium">

<h3>🕊 RíndeTE</h3>

<p class="precio">647 €</p>

<br>

<label class="aceptacion">
<input type="checkbox" id="acepta-rindete">
<span>
He leído y acepto las
<a href="condiciones-servicio.html" target="_blank">Condiciones del Servicio</a>
y la
<a href="política-privacidad.html" target="_blank">Política de Privacidad</a>.
</span>
</label>

<br>

<a
href="https://wise.com/pay/r/lWOeYrrScoUWlFY"
class="boton negro boton-pago disabled"
id="pago-wise-rindete"
>
Pagar con Wise
</a>

<br><br>

<a
href="https://www.paypal.com/ncp/payment/XQ6HCV5CLCWM6"
class="boton blanco boton-pago disabled"
id="pago-paypal-rindete"
>
Pagar con PayPal o tarjeta
</a>

</div>

</div>

</section>
<section class="confirmacion">

<p class="mini-title">
ÚLTIMO PASO
</p>

<h2>
¿Has realizado el pago?
</h2>

<a href="gracias.html" class="boton negro">
Acceder
</a>

</section>
  <script>

const checkboxAcercate = document.getElementById("acepta-acercate");
const botonAcercate = document.getElementById("pago-acercate");

checkboxAcercate.addEventListener("change", function() {

    if (this.checked) {

        botonAcercate.classList.remove("disabled");

    } else {

        botonAcercate.classList.add("disabled");

    }

});

botonAcercate.addEventListener("click", function(event) {

    if (!checkboxAcercate.checked) {

        event.preventDefault();

    }

});
const checkboxRindete = document.getElementById("acepta-rindete");
const botonWiseRindete = document.getElementById("pago-wise-rindete");
const botonPaypalRindete = document.getElementById("pago-paypal-rindete");

checkboxRindete.addEventListener("change", function() {

    if (this.checked) {

        botonWiseRindete.classList.remove("disabled");
        botonPaypalRindete.classList.remove("disabled");

    } else {

        botonWiseRindete.classList.add("disabled");
        botonPaypalRindete.classList.add("disabled");

    }

});

botonWiseRindete.addEventListener("click", function(event) {

    if (!checkboxRindete.checked) {

        event.preventDefault();

    }

});

botonPaypalRindete.addEventListener("click", function(event) {

    if (!checkboxRindete.checked) {

        event.preventDefault();

    }

});
</script>
</body>

</html>
